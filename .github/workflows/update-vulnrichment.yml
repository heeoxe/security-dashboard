name: Fetch CISA Vulnrichment

on:
  schedule:
    - cron: '0 23 * * *'   # 매일 KST 오전 8시 (UTC 23:00 전날)
    - cron: '0 11 * * *'   # 매일 KST 오후 8시 (UTC 11:00)
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Vulnrichment CVEs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: node scripts/fetch-vulnrichment.mjs

      - name: Commit vulnrichment.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add vulnrichment.json
          git diff --cached --quiet && echo "변경사항 없음" || git commit -m "chore: update vulnrichment.json [$(date '+%Y-%m-%d')]"
          git push
